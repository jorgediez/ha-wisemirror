name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: Pytest (HA ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported release (hacs.json "homeassistant")
          - name: "2025.1"
            python: "3.12"
            harness: "pytest-homeassistant-custom-component==0.13.205"
          # newest release
          - name: latest
            python: "3.14"
            harness: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.harness }}"
      - run: pytest -v
