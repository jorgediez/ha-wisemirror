name: Compatibility report
description: Tell us whether the integration works with your mirror.
labels: [compatibility]
body:
  - type: input
    id: brand
    attributes:
      label: Mirror brand
      placeholder: Alasta, BYECOLD, GS Mirror, ...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model shown in Home Assistant
      placeholder: 2M09
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware shown in Home Assistant
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - Everything works
        - Partially (details below)
        - Not discovered / doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which entities work or don't (e.g. no humidity sensor, key tone unsupported, ...). Diagnostics help.
