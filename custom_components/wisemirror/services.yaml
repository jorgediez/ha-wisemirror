set_location:
  target:
    device:
      integration: wisemirror
  fields:
    name:
      required: true
      example: "León"
      selector:
        text:
    latitude:
      required: true
      example: 42.6028912
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: true
      example: -5.5580577
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
