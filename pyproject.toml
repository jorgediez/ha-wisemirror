[project]
name = "ha-wisemirror"
version = "1.0.0"
description = "Home Assistant custom integration for WiseMirror weather-station mirrors"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0913",  # HA test/entity signatures take many args
    "PLR2004",  # magic values are protocol offsets
    "RUF001",   # "…" in user-facing strings
    "RUF012",   # HA entities declare _attr_* lists as class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0917", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
force-sort-within-sections = true
combine-as-imports = true
